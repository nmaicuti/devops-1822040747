name: Website CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Kiem tra ma nguon
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Kiem tra cac file bat buoc
        run: |
          test -f index.html || { echo "LỖI: Thiếu index.html"; exit 1; }
          test -f style.css || { echo "LỖI: Thiếu style.css"; exit 1; }
          test -f script.js || { echo "LỖI: Thiếu script.js"; exit 1; }

      - name: Kiem tra the title
        run: |
          if grep -Eiq '<title[^>]*>[^<]+</title>' index.html; then
            echo "OK: Da tim thay the title."
          else
            echo "LỖI: index.html chưa có thẻ title hợp lệ."
            exit 1
          fi

  deploy:
    name: Trien khai GitHub Pages
    needs: check
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cau hinh GitHub Pages
        uses: actions/configure-pages@v5

      - name: Dong goi website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Trien khai website
        id: deployment
        uses: actions/deploy-pages@v4